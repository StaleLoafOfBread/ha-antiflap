name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate manifest version
    if: github.event_name == 'pull_request'
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out pull request
        uses: "actions/checkout@v4"

      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Install version parser
        run: python -m pip install packaging

      - name: Compare manifest versions
        run: |
          base_version="$(git show FETCH_HEAD:custom_components/antiflap/manifest.json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          pr_version="$(python -c 'import json; print(json.load(open("custom_components/antiflap/manifest.json", encoding="utf-8"))["version"])')"

          echo "Base branch: ${{ github.base_ref }}"
          echo "Base manifest version: ${base_version}"
          echo "Pull request manifest version: ${pr_version}"

          python - "${base_version}" "${pr_version}" <<'PY'
          import sys
          from packaging.version import Version

          base_version = sys.argv[1]
          pr_version = sys.argv[2]

          if Version(pr_version) <= Version(base_version):
              print(
                  f"Manifest version must be greater than the base branch version: "
                  f"{pr_version} <= {base_version}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Manifest version increased: {base_version} -> {pr_version}")
          PY

  validate-hacs:
    name: Validate with HACS
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    name: Validate with Hassfest
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out repository
        uses: "actions/checkout@v4"

      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
